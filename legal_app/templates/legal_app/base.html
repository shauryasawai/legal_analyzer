{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}LexAI — Legal Document Analyzer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'legal_app/css/main.css' %}"/>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span class="brand-icon">⚖</span>
      <span>Lex<em>AI</em></span>
    </a>
    <div class="nav-links">
      <a href="/">Analyze</a>
      <span class="nav-badge">Powered by Claude</span>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>LexAI — AI Legal Document Analyzer &nbsp;·&nbsp; Not a substitute for professional legal advice</p>
  </footer>

  <script src="{% static 'legal_app/js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
